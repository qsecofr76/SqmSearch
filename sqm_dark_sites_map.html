Maltatal Hochalmstra\u00dfe (K\u00f6lnbreinsperre / Diga)", "lat": 47.0783, "lon": 13.3361, "macro_region": "Carinzia (Austria)", "region": "Malta / Alti Tauri (K\u00e4rnten - AT)", "access": "Strada alpina a pedaggio attraverso la valle delle cascate fino alla mastodontica diga di K\u00f6lnbrein a 1933m. Piazzale asfaltato enorme, circondato dai ghiacciai degli Alti Tauri. SQM straordinario: ~21.93!", "paved": true, "sqm_2025": 21.93, "elevation_m": 1946, "bortle": "Classe 2 (Cielo buio tipico)", "nelm": 6.59, "duration_min": 214, "distance_km": 300.7, "duration_str": "3h 34m", "gmaps_url": "https://www.google.com/maps/dir/?api=1&origin=45.8617,12.5539&destination=47.0783,13.3361&travelmode=driving"}, {"name": "Passo Pennes (Penser Joch)", "lat": 46.8178, "lon": 11.4406, "macro_region": "Trentino-Alto Adige", "region": "Sarentino / Vipiteno (BZ)", "access": "SS508 panoramica asfaltata. Valico ad alta quota a 2211m tra Val Sarentino e Wipptal. Vasto parcheggio al rifugio di vetta. Buio profondo eccezionale: SQM ~21.78.", "paved": true, "sqm_2025": 21.78, "elevation_m": 2170, "bortle": "Classe 3 (Cielo rurale)", "nelm": 6.52, "duration_min": 218, "distance_km": 247.8, "duration_str": "3h 38m", "gmaps_url": "https://www.google.com/maps/dir/?api=1&origin=45.8617,12.5539&destination=46.8178,11.4406&travelmode=driving"}, {"name": "Nockalmstra\u00dfe (Eisentalh\u00f6he / Glockenh\u00fctte)", "lat": 46.8778, "lon": 13.7844, "macro_region": "Carinzia (Austria)", "region": "Parco Biosfera Nockberge (K\u00e4rnten - AT)", "access": "Strada alpina panoramica a pedaggio asfaltata (aperta maggio-ottobre). Grandi parcheggi al valico di Eisentalh\u00f6he a 2049m. Cielo notturno tra i pi\u00f9 bui e limpidi dell'arco alpino orientale: SQM ~21.90!", "paved": true, "sqm_2025": 21.9, "elevation_m": 2129, "bortle": "Classe 2 (Cielo buio tipico)", "nelm": 6.58, "duration_min": 219, "distance_km": 263.8, "duration_str": "3h 39m", "gmaps_url": "https://www.google.com/maps/dir/?api=1&origin=45.8617,12.5539&destination=46.8778,13.7844&travelmode=driving"}, {"name": "Emberger Alm (Greifenburg / Drautal)", "lat": 46.7867, "lon": 13.1492, "macro_region": "Carinzia (Austria)", "region": "Greifenburg / Drautal (K\u00e4rnten - AT)", "access": "Strada asfaltata di montagna da Greifenburg. Uno dei siti astronomici pi\u00f9 famosi d'Europa a 1800m, sede storica dell'Internationales Teleskoptreffen (ITT). Orizzonte sud apertissimo sulla Valle della Drava, aria tersa e buio profondo: SQM ~21.88!", "paved": true, "sqm_2025": 21.88, "elevation_m": 2006, "bortle": "Classe 3 (Cielo rurale)", "nelm": 6.57, "duration_min": 230, "distance_km": 242.5, "duration_str": "3h 50m", "gmaps_url": "https://www.google.com/maps/dir/?api=1&origin=45.8617,12.5539&destination=46.7867,13.1492&travelmode=driving"}, {"name": "Passo Giovo (Jaufenpass)", "lat": 46.8272, "lon": 11.3208, "macro_region": "Trentino-Alto Adige", "region": "San Leonardo in Passiria / Vipiteno (BZ)", "access": "SS44 asfaltata. Valico alpino a 2094m tra la Passiria e la Val d'Isarco. Parcheggi al passo con vista sulle Alpi Breonie. SQM ~21.72.", "paved": true, "sqm_2025": 21.8, "elevation_m": 1784, "bortle": "Classe 3 (Cielo rurale)", "nelm": 6.53, "duration_min": 231, "distance_km": 258.5, "duration_str": "3h 51m", "gmaps_url": "https://www.google.com/maps/dir/?api=1&origin=45.8617,12.5539&destination=46.8272,11.3208&travelmode=driving"}, {"name": "Val Senales (Maso Corto / Kurzras)", "lat": 46.7561, "lon": 10.7817, "macro_region": "Trentino-Alto Adige", "region": "Senales / Alpi Venoste (BZ)", "access": "SP3 lungo la Val Senales fino al grande parcheggio di Maso Corto a 2011m. Circondato da vette oltre i 3000m che fungono da schermo totale per le luci urbane.", "paved": true, "sqm_2025": 21.86, "elevation_m": 2003, "bortle": "Classe 3 (Cielo rurale)", "nelm": 6.56, "duration_min": 247, "distance_km": 290.2, "duration_str": "4h 07m", "gmaps_url": "https://www.google.com/maps/dir/?api=1&origin=45.8617,12.5539&destination=46.7561,10.7817&travelmode=driving"}, {"name": "Val Martello (Parcheggio Enzian / Trattla)", "lat": 46.505, "lon": 10.7167, "macro_region": "Trentino-Alto Adige", "region": "Martello / Parco Nazionale dello Stelvio (BZ)", "access": "SP36 lungo la Val Martello fino al parcheggio Enzian a 2050m al capolinea della strada. Valle laterale chiusa, cielo montano limpidissimo sopra il Cevedale.", "paved": true, "sqm_2025": 21.78, "elevation_m": 2000, "bortle": "Classe 3 (Cielo rurale)", "nelm": 6.52, "duration_min": 255, "distance_km": 298.4, "duration_str": "4h 15m", "gmaps_url": "https://www.google.com/maps/dir/?api=1&origin=45.8617,12.5539&destination=46.505,10.7167&travelmode=driving"}, {"name": "Passo dello Stelvio (Stilfser Joch)", "lat": 46.5286, "lon": 10.4531, "macro_region": "Trentino-Alto Adige", "region": "Prato allo Stelvio / Bormio (BZ/SO)", "access": "SS38 dello Stelvio (aperta fine maggio - inizio novembre). Il valico stradale asfaltato pi\u00f9 alto d'Italia a 2758m. Atmosfera tersissima, SQM ~21.79.", "paved": true, "sqm_2025": 21.79, "elevation_m": 2759, "bortle": "Classe 3 (Cielo rurale)", "nelm": 6.53, "duration_min": 283, "distance_km": 325.3, "duration_str": "4h 43m", "gmaps_url": "https://www.google.com/maps/dir/?api=1&origin=45.8617,12.5539&destination=46.5286,10.4531&travelmode=driving"}];

        const map = L.map('map').setView([origin.lat, origin.lon], 9);

        const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        });

        const esriTopo = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Topo Relief',
            maxZoom: 18
        });

        const esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; World Imagery',
            maxZoom: 18
        });

        osm.addTo(map);

        L.control.layers({
            "Mappa Stradale (OpenStreetMap)": osm,
            "Rilievo Montano (Esri Topo)": esriTopo,
            "Satellite (Esri Imagery)": esriSat
        }, null, { position: 'topright' }).addTo(map);

        const originIcon = L.divIcon({
            className: 'origin-marker',
            html: '<div style="background:#ef4444;border:2px solid white;border-radius:50%;width:16px;height:16px;box-shadow:0 0 8px rgba(239,68,68,0.8);"></div>',
            iconSize: [16, 16],
            iconAnchor: [8, 8]
        });
        const originMarker = L.marker([origin.lat, origin.lon], {icon: originIcon}).addTo(map)
            .bindPopup(`<b>Punto di Partenza:</b><br>${origin.name}<br><small>Lat: ${origin.lat}, Lon: ${origin.lon}</small>`);

        const markers = [originMarker];

        function getMarkerColor(sqm) {
            if (sqm >= 21.75) return '#047857';
            if (sqm >= 21.70) return '#10b981';
            if (sqm >= 21.50) return '#2563eb';
            if (sqm >= 21.00) return '#7c3aed';
            return '#d97706';
        }

        function getSqmBadgeClass(sqm) {
            if (sqm >= 21.75) return 'badge-sqm-dark';
            if (sqm >= 21.70) return 'badge-sqm-high';
            if (sqm >= 21.50) return 'badge-sqm-mid';
            if (sqm >= 21.00) return 'badge-sqm-violet';
            return 'badge-sqm-amber';
        }

        const cardsContainer = document.getElementById('cards-list');

        sites.forEach((site, idx) => {
            const color = getMarkerColor(site.sqm_2025);
            const badgeClass = getSqmBadgeClass(site.sqm_2025);
            
            const icon = L.divIcon({
                className: 'custom-pin',
                html: `<div style="background:${color};border:2px solid white;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:white;font-size:10px;font-weight:bold;box-shadow:0 0 10px ${color}88;">${idx + 1}</div>`,
                iconSize: [22, 22],
                iconAnchor: [11, 11]
            });

            const marker = L.marker([site.lat, site.lon], {icon: icon}).addTo(map);
            markers.push(marker);

            const popupContent = `
                <div style="font-family: sans-serif; min-width: 210px;">
                    <h3 style="margin: 0 0 4px 0; color: #60a5fa; font-size: 1rem;">${idx + 1}. ${site.name}</h3>
                    <div style="font-size: 0.8rem; color: #9ca3af; margin-bottom: 6px;"><b>${site.macro_region}</b> • ${site.region}</div>
                    <div style="margin-bottom: 6px;">
                        <span class="badge ${badgeClass}">SQM ${site.sqm_2025}</span>
                        <span class="badge badge-time">🚗 ${site.duration_str} (${site.distance_km} km)</span>
                    </div>
                    <div style="font-size: 0.8rem; margin-bottom: 4px;"><b>Quota:</b> ${site.elevation_m} m s.l.m.</div>
                    <div style="font-size: 0.8rem; margin-bottom: 4px;"><b>Bortle:</b> ${site.bortle}</div>
                    <div style="font-size: 0.78rem; color: #d1d5db; margin-top: 6px;">${site.access}</div>
                    <a class="nav-btn" href="${site.gmaps_url}" target="_blank">🧭 Naviga con Google Maps</a>
                </div>
            `;
            marker.bindPopup(popupContent);

            const card = document.createElement('div');
            card.className = 'site-card';
            card.innerHTML = `
                <div class="site-title">${idx + 1}. ${site.name}</div>
                <div class="site-region"><span class="badge badge-macro">${site.macro_region}</span> ${site.region}</div>
                <div style="margin-bottom: 6px;">
                    <span class="badge ${badgeClass}">SQM ${site.sqm_2025}</span>
                    <span class="badge badge-time">🚗 ${site.duration_str}</span>
                    <span class="badge badge-alt">🏔️ ${site.elevation_m}m</span>
                </div>
                <div style="font-size: 0.76rem; color: #9ca3af;">Distanza: ${site.distance_km} km • ${site.bortle}</div>
                <div class="site-desc">${site.access}</div>
                <a class="nav-btn" href="${site.gmaps_url}" target="_blank">🧭 Avvia Navigatore</a>
            `;

            card.addEventListener('click', () => {
                document.querySelectorAll('.site-card').forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                map.flyTo([site.lat, site.lon], 11, { duration: 1.2 });
                marker.openPopup();
            });

            cardsContainer.appendChild(card);
        });

        if (markers.length > 0) {
            const group = L.featureGroup(markers);
            map.fitBounds(group.getBounds().pad(0.05));
        }

        let clickMarker = null;
        let clickRouteLayer = null;

        map.on('click', async function(e) {
            const lat = e.latlng.lat;
            const lon = e.latlng.lng;

            if (clickMarker) map.removeLayer(clickMarker);
            if (clickRouteLayer) map.removeLayer(clickRouteLayer);

            const loadingPopup = L.popup()
                .setLatLng(e.latlng)
                .setContent('<div style="padding:10px;text-align:center;font-family:sans-serif;">⏳ <b>Calcolo in corso...</b><br><small style="color:#9ca3af;">Interrogazione SQM e tempo guida da ' + origin.name + '</small></div>')
                .openOn(map);

            try {
                const now = new Date().getTime();
                const qk = btoa(now + ";isuckdicks:)");
                const lpmUrl = "https://www.lightpollutionmap.info/api/queryraster?qk=" + qk + "&ql=sb_2025&qt=point&qd=" + lon.toFixed(5) + "," + lat.toFixed(5);
                
                let sqm = 0;
                let elev = 0;
                let bortle = "N/D";
                let nelm = "N/D";

                try {
                    const lpmRes = await fetch(lpmUrl);
                    const lpmText = await lpmRes.text();
                    const parts = lpmText.split(',');
                    const v = parseFloat(parts[0].split(';').pop());
                    elev = parts[1] ? Math.round(parseFloat(parts[1])) : 0;

                    sqm = Math.log10((v + 0.171168465) / 108e6) / -0.4;
                    sqm = Math.round(sqm * 100) / 100;
                    nelm = (7.93 - 5 * Math.log10(Math.pow(10, 4.316 - sqm / 5) + 1)).toFixed(2);

                    if (sqm < 18.38) bortle = "Classe 8-9 (Città)";
                    else if (sqm < 18.94) bortle = "Classe 7 (Periurbano)";
                    else if (sqm < 19.50) bortle = "Classe 6 (Suburbano)";
                    else if (sqm < 20.49) bortle = "Classe 5 (Suburbano)";
                    else if (sqm < 21.69) bortle = "Classe 4 (Transizione)";
                    else if (sqm < 21.89) bortle = "Classe 3 (Rurale)";
                    else if (sqm < 21.99) bortle = "Classe 2 (Buio tipico)";
                    else bortle = "Classe 1 (Cielo eccellente)";
                } catch(err) {
                    console.error("LPM error:", err);
                }

                let distKm = 0;
                let durStr = "N/D";
                const osrmUrl = "https://router.project-osrm.org/route/v1/driving/" + origin.lon + "," + origin.lat + ";" + lon.toFixed(5) + "," + lat.toFixed(5) + "?overview=full&geometries=geojson";

                try {
                    const osrmRes = await fetch(osrmUrl);
                    const osrmData = await osrmRes.json();
                    if (osrmData.code === "Ok" && osrmData.routes && osrmData.routes.length > 0) {
                        const r = osrmData.routes[0];
                        distKm = Math.round((r.distance / 1000) * 10) / 10;
                        const durMin = Math.round(r.duration / 60);
                        durStr = Math.floor(durMin / 60) + "h " + (durMin % 60) + "m (" + durMin + " min)";

                        const coords = r.geometry.coordinates.map(c => [c[1], c[0]]);
                        clickRouteLayer = L.polyline(coords, {
                            color: '#f43f5e',
                            weight: 4,
                            opacity: 0.9,
                            dashArray: '6, 8'
                        }).addTo(map);
                    }
                } catch(err) {
                    console.error("OSRM error:", err);
                }

                const badgeClass = getSqmBadgeClass(sqm);
                const gmapsUrl = "https://www.google.com/maps/dir/?api=1&origin=" + origin.lat + "," + origin.lon + "&destination=" + lat.toFixed(5) + "," + lon.toFixed(5) + "&travelmode=driving";

                const clickIcon = L.divIcon({
                    className: 'click-pin',
                    html: '<div style="background:#f43f5e;border:2px solid white;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:white;font-size:12px;font-weight:bold;box-shadow:0 0 14px rgba(244,63,94,1);">📍</div>',
                    iconSize: [24, 24],
                    iconAnchor: [12, 12]
                });

                clickMarker = L.marker([lat, lon], { icon: clickIcon }).addTo(map);
                map.closePopup(loadingPopup);

                const popupHtml = '<div style="font-family:sans-serif;min-width:230px;">' +
                    '<h3 style="margin:0 0 4px 0;color:#f43f5e;font-size:1.05rem;">📍 Punto Cliccato</h3>' +
                    '<div style="font-size:0.78rem;color:#9ca3af;margin-bottom:8px;">Coord: ' + lat.toFixed(4) + ', ' + lon.toFixed(4) + '</div>' +
                    '<div style="margin-bottom:6px;">' +
                        '<span class="badge ' + badgeClass + '">SQM ' + (sqm > 0 ? sqm.toFixed(2) : 'N/D') + '</span> ' +
                        '<span class="badge badge-time">🚗 ' + durStr + '</span>' +
                    '</div>' +
                    '<div style="font-size:0.8rem;margin-bottom:4px;"><b>Distanza stradale:</b> ' + (distKm > 0 ? distKm + ' km' : 'N/D') + '</div>' +
                    '<div style="font-size:0.8rem;margin-bottom:4px;"><b>Quota suolo:</b> ' + elev + ' m s.l.m.</div>' +
                    '<div style="font-size:0.8rem;margin-bottom:6px;"><b>Bortle:</b> ' + bortle + ' • <b>NELM:</b> ' + nelm + ' mag</div>' +
                    '<a class="nav-btn" style="background:#f43f5e;" href="' + gmapsUrl + '" target="_blank">🧭 Naviga verso questo punto</a>' +
                '</div>';

                clickMarker.bindPopup(popupHtml).openPopup();

            } catch(e) {
                loadingPopup.setContent('<div style="color:#ef4444;padding:8px;">Errore durante il calcolo. Riprova.</div>');
            }
        });
    </script>
</body>
</html>
